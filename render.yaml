# Render Blueprint for the GuessIngs API + PostgreSQL.
# Render dashboard → New → Blueprint → select this repository and branch.
# The frontend is deployed separately on Vercel (see README → Deployment).
services:
  - type: web
    name: guessings-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: guessings-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      # Must be the same value as PROXY_SECRET on Vercel.
      - key: PROXY_SECRET
        sync: false
      # Optional: enables Claude label reading, classification and summaries.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5

databases:
  - name: guessings-db
    plan: free
    databaseName: guessings
    user: guessings
