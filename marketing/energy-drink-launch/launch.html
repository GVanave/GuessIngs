<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLTRA Launch Film</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; }
  body.render canvas { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * VOLTRA — energy drink launch film.
 * Every frame is a pure function of time: render(t) draws the frame at t seconds.
 * Open this file in a browser to preview (loops), or use render.mjs to export an MP4.
 */
const W = 1920, H = 1080, DURATION = 24;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const LIME = '#c6ff00', CYAN = '#00e5ff', INK = '#05070d', WHITE = '#f4f7fb';
const FONT = '"Liberation Sans", "Helvetica Neue", Arial, sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeBack = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
// visible between a and b with fade-in/out of length f
const window_ = (t, a, b, f = 0.4) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));

// deterministic pseudo random
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
const R = rng(7);
const PARTICLES = Array.from({ length: 140 }, () => ({
  x: R() * W, y: R() * H, r: 0.6 + R() * 2.4, sp: 20 + R() * 70, ph: R() * 6.28, hue: R() < 0.6 ? LIME : CYAN,
}));
const BUBBLES = Array.from({ length: 60 }, () => ({
  x: R(), r: 3 + R() * 12, sp: 120 + R() * 260, off: R() * 1400, wob: R() * 6.28,
}));
const DROPS = Array.from({ length: 46 }, () => ({
  a: R() * Math.PI * 2, v: 500 + R() * 900, r: 4 + R() * 14, spin: R(),
}));

function text(str, x, y, { size = 60, weight = 700, color = WHITE, align = 'center', spacing = 0, italic = false, alpha = 1, glow = 0, glowColor = LIME } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT}`;
  ctx.letterSpacing = `${spacing}px`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glowColor; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function bolt(cx, cy, s, fill, alpha = 1, glow = 0) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy);
  ctx.scale(s / 100, s / 100);
  ctx.beginPath();
  ctx.moveTo(18, -100); ctx.lineTo(-52, 12); ctx.lineTo(-4, 12);
  ctx.lineTo(-20, 100); ctx.lineTo(54, -16); ctx.lineTo(6, -16); ctx.closePath();
  if (glow) { ctx.shadowColor = fill; ctx.shadowBlur = glow; }
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.restore();
}

// jagged electric arc between two points
function lightning(x1, y1, x2, y2, seed, alpha, width = 4, color = CYAN) {
  if (alpha <= 0) return;
  const n = 18;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 30;
  ctx.lineJoin = 'round';
  for (const [w, a] of [[width * 3, 0.25], [width, 1]]) {
    const rr = rng(seed);
    ctx.lineWidth = w;
    ctx.globalAlpha = alpha * a;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    for (let i = 1; i < n; i++) {
      const k = i / n;
      const j = (rr() - 0.5) * 90 * Math.sin(k * Math.PI);
      const nx = -(y2 - y1), ny = x2 - x1, len = Math.hypot(nx, ny) || 1;
      ctx.lineTo(lerp(x1, x2, k) + nx / len * j, lerp(y1, y2, k) + ny / len * j);
    }
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- the can ----------
function drawCan(cx, cy, scale, spin, alpha = 1, tilt = 0) {
  if (alpha <= 0) return;
  const w = 250, h = 520;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.scale(scale, scale);
  const x = -w / 2, y = -h / 2;

  // halo + floor shadow
  const halo = ctx.createRadialGradient(0, 0, 40, 0, 0, 520);
  halo.addColorStop(0, 'rgba(198,255,0,0.28)');
  halo.addColorStop(1, 'rgba(198,255,0,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(-600, -600, 1200, 1200);
  ctx.save();
  ctx.scale(1, 0.18);
  const sh = ctx.createRadialGradient(0, (h / 2 + 40) / 0.18, 10, 0, (h / 2 + 40) / 0.18, 220);
  sh.addColorStop(0, 'rgba(0,0,0,0.75)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.fillRect(-300, (h / 2 - 200) / 0.18, 600, 500 / 0.18);
  ctx.restore();

  // body
  roundRect(x, y + 22, w, h - 40, 26);
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#0b0f17';
  ctx.fillRect(x, y, w, h);

  // scrolling label (fake rotation)
  const period = w * 2.2;
  const off = ((spin % 1) + 1) % 1 * period;
  // lime wave band, seamless across the wrap
  const bandY = u => y + h * (0.66 + 0.05 * Math.sin((u / period) * Math.PI * 2));
  ctx.fillStyle = LIME;
  ctx.beginPath();
  for (let px = x - 10; px <= x + w + 10; px += 6) ctx.lineTo(px, bandY(px - x + off) - 26);
  for (let px = x + w + 10; px >= x - 10; px -= 6) ctx.lineTo(px, bandY(px - x + off) + 26);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = CYAN;
  ctx.beginPath();
  for (let px = x - 10; px <= x + w + 10; px += 6) ctx.lineTo(px, bandY(px - x + off) + 44);
  for (let px = x + w + 10; px >= x - 10; px -= 6) ctx.lineTo(px, bandY(px - x + off) + 50);
  ctx.closePath();
  ctx.fill();
  for (let k = -1; k <= 1; k++) {
    const lx = x + k * period - off;
    // vertical brand name
    ctx.save();
    ctx.translate(lx + w * 0.5, y + h * 0.36);
    ctx.rotate(-Math.PI / 2);
    ctx.font = `italic 900 90px ${FONT}`;
    ctx.letterSpacing = '4px';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = WHITE;
    ctx.fillText('VOLTRA', 0, 0);
    ctx.restore();
    bolt(lx + w * 1.6, y + h * 0.30, 64, LIME, 1, 18);
    ctx.save();
    ctx.font = `700 22px ${FONT}`;
    ctx.letterSpacing = '4px';
    ctx.textAlign = 'center';
    ctx.fillStyle = WHITE;
    ctx.fillText('CITRUS', lx + w * 1.6, y + h * 0.45);
    ctx.fillText('GINGER', lx + w * 1.6, y + h * 0.49);
    ctx.font = `900 20px ${FONT}`;
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    const zx = lx + w * 1.6;
    ctx.fillText('ZERO SUGAR', zx, bandY(zx - x + off));
    ctx.restore();
  }

  // cylindrical shading
  const shade = ctx.createLinearGradient(x, 0, x + w, 0);
  shade.addColorStop(0.00, 'rgba(0,0,0,0.85)');
  shade.addColorStop(0.18, 'rgba(0,0,0,0.25)');
  shade.addColorStop(0.32, 'rgba(255,255,255,0.22)');
  shade.addColorStop(0.40, 'rgba(255,255,255,0.05)');
  shade.addColorStop(0.70, 'rgba(0,0,0,0.15)');
  shade.addColorStop(1.00, 'rgba(0,0,0,0.9)');
  ctx.fillStyle = shade;
  ctx.fillRect(x, y, w, h);
  ctx.restore();

  // neck + lid
  const metal = ctx.createLinearGradient(x, 0, x + w, 0);
  metal.addColorStop(0, '#4a525e'); metal.addColorStop(0.3, '#e9eef4');
  metal.addColorStop(0.55, '#9aa3ae'); metal.addColorStop(1, '#3a414b');
  ctx.fillStyle = metal;
  ctx.beginPath();
  ctx.moveTo(x + 4, y + 40);
  ctx.bezierCurveTo(x + 10, y + 16, x + 22, y + 8, x + 26, y + 4);
  ctx.lineTo(x + w - 26, y + 4);
  ctx.bezierCurveTo(x + w - 22, y + 8, x + w - 10, y + 16, x + w - 4, y + 40);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, y + 6, w / 2 - 26, 14, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#c9d0d8';
  ctx.fill();
  ctx.strokeStyle = '#7d8691';
  ctx.lineWidth = 3;
  ctx.stroke();
  // tab
  ctx.beginPath();
  ctx.ellipse(-8, y + 6, 34, 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#aab3bd';
  ctx.fill();
  // base
  ctx.fillStyle = metal;
  ctx.beginPath();
  ctx.moveTo(x + 2, y + h - 22);
  ctx.bezierCurveTo(x + 8, y + h - 4, x + 30, y + h, x + 40, y + h);
  ctx.lineTo(x + w - 40, y + h);
  ctx.bezierCurveTo(x + w - 30, y + h, x + w - 8, y + h - 4, x + w - 2, y + h - 22);
  ctx.closePath();
  ctx.fill();

  // condensation sparkle
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  const dr = rng(99);
  for (let i = 0; i < 26; i++) {
    const px = x + 20 + dr() * (w - 40), py = y + 60 + dr() * (h - 120), pr = 0.8 + dr() * 2;
    ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------- backgrounds ----------
function background(t, energy) {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, 50, W / 2, H * 0.55, 1200);
  g.addColorStop(0, `rgba(${Math.round(20 + 30 * energy)},${Math.round(30 + 40 * energy)},${Math.round(45 + 20 * energy)},1)`);
  g.addColorStop(1, INK);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // perspective grid floor
  ctx.save();
  ctx.globalAlpha = 0.18 * energy;
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 1.5;
  const horizon = H * 0.62;
  for (let i = -20; i <= 20; i++) {
    ctx.beginPath();
    ctx.moveTo(W / 2 + i * 40, horizon);
    ctx.lineTo(W / 2 + i * 260, H);
    ctx.stroke();
  }
  for (let i = 0; i < 12; i++) {
    const k = ((i + (t * 0.8) % 1) / 12);
    const yy = horizon + Math.pow(k, 2.2) * (H - horizon);
    ctx.globalAlpha = 0.18 * energy * k;
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
  }
  ctx.restore();

  // floating particles
  for (const p of PARTICLES) {
    const y = ((p.y - t * p.sp) % H + H) % H;
    const x = p.x + Math.sin(t * 0.7 + p.ph) * 18;
    ctx.globalAlpha = (0.25 + 0.5 * energy) * (0.5 + 0.5 * Math.sin(t * 2 + p.ph));
    ctx.fillStyle = p.hue;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function vignette() {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function flash(amount, color = '255,255,255') {
  if (amount <= 0) return;
  ctx.fillStyle = `rgba(${color},${amount})`;
  ctx.fillRect(0, 0, W, H);
}

function bubbles(t, t0, alpha) {
  if (alpha <= 0) return;
  for (const b of BUBBLES) {
    const y = H + 60 - ((t - t0) * b.sp + b.off) % (H + 200);
    const x = b.x * W + Math.sin(t * 2 + b.wob) * 14;
    ctx.save();
    ctx.globalAlpha = alpha * 0.55;
    ctx.strokeStyle = 'rgba(220,255,160,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(x - b.r * 0.35, y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function splash(t, t0, cx, cy) {
  const k = t - t0;
  if (k < 0 || k > 1.6) return;
  for (const d of DROPS) {
    const dist = d.v * k;
    const x = cx + Math.cos(d.a) * dist;
    const y = cy + Math.sin(d.a) * dist * 0.6 + 700 * k * k;
    ctx.save();
    ctx.globalAlpha = clamp(1 - k / 1.6) * 0.9;
    ctx.fillStyle = d.spin > 0.5 ? LIME : 'rgba(255,240,120,1)';
    ctx.shadowColor = LIME; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(x, y, d.r, d.r * 1.3, d.a, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ---------- scenes ----------
function sceneIntro(t) {
  // 0 – 3.2s: charging up
  const a = window_(t, 0, 3.3, 0.5);
  if (a <= 0) return;
  const charge = easeInOut(prog(t, 0.4, 2.8));
  // battery
  const bw = 360, bh = 150, bx = W / 2 - bw / 2, by = H / 2 - bh / 2 - 40;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = WHITE; ctx.lineWidth = 8;
  roundRect(bx, by, bw, bh, 22); ctx.stroke();
  ctx.fillStyle = WHITE;
  roundRect(bx + bw + 6, by + bh / 2 - 26, 22, 52, 8); ctx.fill();
  ctx.shadowColor = LIME; ctx.shadowBlur = 40;
  ctx.fillStyle = LIME;
  roundRect(bx + 16, by + 16, (bw - 32) * charge, bh - 32, 12); ctx.fill();
  ctx.restore();
  bolt(W / 2, H / 2 - 40, 55, INK, a * clamp(charge * 3));
  text(`${Math.round(charge * 100)}%`, W / 2, by + bh + 80, { size: 44, weight: 700, spacing: 6, alpha: a, color: LIME });
  text('SOMETHING IS CHARGING', W / 2, by - 90, { size: 40, weight: 700, spacing: 18, alpha: a * prog(t, 0.2, 0.9) });
  // arcs around it as it fills up
  const flick = Math.floor(t * 14);
  if (charge > 0.5) {
    lightning(bx - 200, by - 60, bx, by + bh / 2, flick * 3 + 1, a * (charge - 0.5) * 2 * (flick % 2));
    lightning(bx + bw + 230, by + bh + 60, bx + bw + 28, by + bh / 2, flick * 5 + 2, a * (charge - 0.5) * 2 * ((flick + 1) % 2));
  }
}

function sceneReveal(t) {
  // 3.0 – 11s: can bursts in, title
  if (t < 3.0 || t > 16.4) return;
  const kIn = prog(t, 3.0, 4.0);
  const y = lerp(H + 420, H / 2 + 110, easeBack(kIn));
  const exit = easeInOut(prog(t, 10.6, 11.6));        // slide can to left for features
  const cx = lerp(W / 2, W * 0.34, exit);
  const spin = (t - 3) * 0.22;
  const bob = Math.sin(t * 1.6) * 10;
  const scale = lerp(0.88, 0.92, Math.sin(t * 0.8) * 0.5 + 0.5);
  const fadeOut = 1 - prog(t, 15.8, 16.4);
  drawCan(cx, y + bob, scale, spin, fadeOut, Math.sin(t * 0.9) * 0.04);

  // arcs hitting the can at reveal
  const flick = Math.floor(t * 16);
  const arcA = clamp(1 - prog(t, 3.8, 5.2));
  lightning(0, 150, cx - 120, y - 120, flick * 7, arcA * (flick % 2 ? 1 : 0.4), 5, CYAN);
  lightning(W, 980, cx + 120, y + 100, flick * 11, arcA * (flick % 2 ? 0.4 : 1), 5, LIME);

  // title slam
  const titleA = window_(t, 4.0, 10.8, 0.3);
  if (titleA > 0) {
    const k = easeOut(prog(t, 4.0, 4.35));
    const sz = lerp(420, 230, k);
    const shake = (1 - prog(t, 4.0, 4.7)) * 14 * Math.sin(t * 90);
    ctx.save();
    ctx.globalAlpha = titleA;
    ctx.globalCompositeOperation = 'lighter';
    text('VOLTRA', W / 2 - 10 + shake, 206, { size: sz, weight: 900, italic: true, spacing: 10, color: 'rgba(0,229,255,0.55)' });
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = titleA;
    text('VOLTRA', W / 2 + shake * -1, 200, { size: sz, weight: 900, italic: true, spacing: 10, glow: 40 });
    ctx.restore();
    text('C L E A N   E N E R G Y', W / 2, 340, { size: 36, weight: 700, color: LIME, alpha: titleA * prog(t, 4.6, 5.2), glow: 16 });
  }

  // flavor callout 6.5 – 10.6
  const fA = window_(t, 6.5, 10.7, 0.4);
  if (fA > 0) {
    const sl = easeOut(prog(t, 6.5, 7.2));
    text('NEW FLAVOR', lerp(W + 200, W - 330, sl), 520, { size: 30, weight: 700, spacing: 10, color: CYAN, alpha: fA });
    text('Citrus', lerp(W + 300, W - 330, easeOut(prog(t, 6.7, 7.4))), 600, { size: 92, weight: 900, italic: true, alpha: fA });
    text('Ginger', lerp(W + 300, W - 330, easeOut(prog(t, 6.9, 7.6))), 700, { size: 92, weight: 900, italic: true, color: LIME, alpha: fA, glow: 20 });
    text('Surge', lerp(W + 300, W - 330, easeOut(prog(t, 7.1, 7.8))), 800, { size: 92, weight: 900, italic: true, alpha: fA });
  }
  // left side copy
  const lA = window_(t, 7.6, 10.7, 0.4);
  if (lA > 0) {
    text('Sparkling. Sharp.', lerp(-300, 330, easeOut(prog(t, 7.6, 8.3))), 620, { size: 52, weight: 700, alpha: lA });
    text('Zero sugar.', lerp(-300, 330, easeOut(prog(t, 7.9, 8.6))), 700, { size: 52, weight: 700, alpha: lA, color: LIME });
  }
}

const FEATURES = [
  ['0 g', 'SUGAR', 'Sweetened with stevia leaf'],
  ['120 mg', 'NATURAL CAFFEINE', 'From green tea & coffee beans'],
  ['B3 · B6 · B12', 'B-VITAMINS', 'Plus vitamin C'],
  ['0', 'ARTIFICIAL COLORS', 'No preservatives either'],
];

function sceneFeatures(t) {
  // 11.4 – 16.2s
  const a = window_(t, 11.4, 16.2, 0.4);
  if (a <= 0) return;
  text("WHAT'S INSIDE", W * 0.66, 170, { size: 34, weight: 700, spacing: 14, color: CYAN, alpha: a * prog(t, 11.4, 11.9) });
  FEATURES.forEach(([big, label, sub], i) => {
    const t0 = 11.7 + i * 0.55;
    const k = easeOut(prog(t, t0, t0 + 0.6));
    const alpha = a * k;
    if (alpha <= 0) return;
    const y = 290 + i * 190;
    const x = lerp(W + 100, W * 0.52, k);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.strokeStyle = 'rgba(198,255,0,0.35)';
    ctx.lineWidth = 2;
    roundRect(x, y - 70, 760, 150, 24); ctx.fill(); ctx.stroke();
    ctx.restore();
    bolt(x + 70, y + 5, 36, LIME, alpha, 14);
    text(big, x + 130, y - 18, { size: 58, weight: 900, italic: true, align: 'left', alpha, color: WHITE });
    ctx.save();
    ctx.font = `italic 900 58px ${FONT}`;
    const bw = ctx.measureText(big).width;
    ctx.restore();
    text(label, x + 150 + bw, y - 16, { size: 28, weight: 700, align: 'left', alpha, color: LIME, spacing: 3 });
    text(sub, x + 130, y + 40, { size: 28, weight: 400, align: 'left', alpha: alpha * 0.8 });
  });
}

const LABEL_ROWS = [
  'Sparkling water', 'Green tea extract', 'Lemon juice', 'Ginger juice', 'Natural caffeine',
  'Citric acid', 'Stevia leaf extract', 'Natural flavors', 'Vitamin C, niacin, B6, B12',
];

function sceneScan(t) {
  // 16.2 – 20.6s: scanned with GuessIngs
  const a = window_(t, 16.2, 20.8, 0.45);
  if (a <= 0) return;
  const k = easeOut(prog(t, 16.2, 17.0));
  // phone
  const pw = 440, ph = 860, px = W / 2 - pw / 2 + lerp(0, 0, k), py = lerp(H + 50, H / 2 - ph / 2, k);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,229,255,0.4)'; ctx.shadowBlur = 60;
  ctx.fillStyle = '#10151f';
  roundRect(px, py, pw, ph, 56); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f6f8fb';
  roundRect(px + 18, py + 18, pw - 36, ph - 36, 42); ctx.fill();
  ctx.fillStyle = '#10151f';
  roundRect(px + pw / 2 - 60, py + 30, 120, 26, 13); ctx.fill();
  ctx.restore();

  const sx = px + 50;
  text('GuessIngs', sx, py + 100, { size: 34, weight: 900, align: 'left', color: '#111827', alpha: a });
  text('Ingredient analysis', sx, py + 138, { size: 20, weight: 400, align: 'left', color: '#6b7280', alpha: a });

  // ingredients check off one by one
  LABEL_ROWS.forEach((row, i) => {
    const r0 = 17.0 + i * 0.13;
    const ra = a * prog(t, r0, r0 + 0.2);
    const yy = py + 190 + i * 38;
    text(row, sx + 36, yy, { size: 22, weight: 400, align: 'left', color: '#1f2937', alpha: ra });
    ctx.save();
    ctx.globalAlpha = ra;
    ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx + 4, yy); ctx.lineTo(sx + 12, yy + 8); ctx.lineTo(sx + 24, yy - 8); ctx.stroke();
    ctx.restore();
  });

  // verdict ring
  const vr = prog(t, 18.3, 19.3);
  const rcx = px + pw / 2, rcy = py + ph - 170, rr = 90;
  ctx.save();
  ctx.globalAlpha = a * prog(t, 18.2, 18.5);
  ctx.lineWidth = 18; ctx.lineCap = 'round';
  ctx.strokeStyle = '#e5e7eb';
  ctx.beginPath(); ctx.arc(rcx, rcy, rr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#16a34a';
  ctx.beginPath(); ctx.arc(rcx, rcy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * easeOut(vr)); ctx.stroke();
  ctx.restore();
  text('GREEN', rcx, rcy, { size: 40, weight: 900, color: '#16a34a', alpha: a * prog(t, 19.0, 19.3) });

  // scan beam
  const beam = prog(t, 16.9, 18.3);
  if (beam > 0 && beam < 1) {
    const by = py + 170 + beam * 360;
    ctx.save();
    ctx.globalAlpha = a * 0.9;
    const g = ctx.createLinearGradient(0, by - 30, 0, by + 4);
    g.addColorStop(0, 'rgba(0,229,255,0)'); g.addColorStop(1, 'rgba(0,229,255,0.8)');
    ctx.fillStyle = g;
    ctx.fillRect(px + 30, by - 30, pw - 60, 34);
    ctx.restore();
  }

  // side copy
  const cA = a * prog(t, 17.2, 17.8);
  text('Nothing to hide.', W * 0.2, H / 2 - 40, { size: 60, weight: 900, italic: true, alpha: cA });
  text('Every ingredient on the label.', W * 0.2, H / 2 + 30, { size: 30, weight: 400, alpha: cA * 0.85 });
  const dA = a * prog(t, 19.2, 19.7);
  text('Scan it yourself', W * 0.8, H / 2 - 40, { size: 52, weight: 900, italic: true, color: LIME, alpha: dA, glow: 18 });
  text('with GuessIngs', W * 0.8, H / 2 + 26, { size: 34, weight: 700, alpha: dA });
}

function sceneEnd(t) {
  // 20.6 – 24s: end card
  const a = prog(t, 20.6, 21.2);
  if (a <= 0) return;
  const k = easeBack(prog(t, 20.6, 21.4));
  drawCan(W / 2, H / 2 + 60, lerp(0.4, 0.95, k), (t - 20) * 0.3, a);
  text('VOLTRA', W / 2, 150, { size: 180, weight: 900, italic: true, spacing: 10, alpha: a, glow: 30 });
  text('Clean energy. Nothing to hide.', W / 2, 270, { size: 40, weight: 400, alpha: a * prog(t, 21.2, 21.8) });
  const cta = prog(t, 21.8, 22.4);
  text('AVAILABLE NOW', W / 2, H - 110, { size: 54, weight: 900, spacing: 16, color: LIME, alpha: cta, glow: 24 });
  text('Citrus Ginger Surge · 250 ml', W / 2, H - 55, { size: 26, weight: 400, alpha: cta * 0.8 });
  // side arcs pulsing
  const flick = Math.floor(t * 12);
  lightning(W / 2 - 700, H / 2 + 60, W / 2 - 190, H / 2 + 60, flick * 13, a * 0.6 * (flick % 3 === 0 ? 1 : 0.3), 3, CYAN);
  lightning(W / 2 + 700, H / 2 + 60, W / 2 + 190, H / 2 + 60, flick * 17, a * 0.6 * (flick % 3 === 1 ? 1 : 0.3), 3, LIME);
}

// ---------- frame ----------
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  const energy = clamp(prog(t, 2.6, 3.4) * (1 - 0.5 * window_(t, 16.2, 20.8, 0.4)));
  background(t, energy);
  bubbles(t, 6.0, window_(t, 6.2, 11.0, 0.8));
  sceneIntro(t);
  sceneReveal(t);
  splash(t, 3.25, W / 2, H / 2);
  sceneFeatures(t);
  sceneScan(t);
  sceneEnd(t);
  vignette();
  // hits: white flash on reveal, lime flash into end card
  flash(0.9 * (1 - prog(t, 3.0, 3.5)) * (t >= 3.0 ? 1 : 0));
  flash(0.6 * (1 - prog(t, 20.6, 21.0)) * (t >= 20.6 ? 1 : 0), '198,255,0');
  // fade to black at the very end
  flash(prog(t, 23.3, 24), '0,0,0');
}

window.render = render;
window.DURATION = DURATION;

if (!location.search.includes('render')) {
  const start = performance.now();
  const loop = now => { render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  document.body.classList.add('render');
  render(0);
}
</script>
</body>
</html>
